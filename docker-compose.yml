# Visa AbsoluteCinema sistema viena komanda:
#   docker compose up --build
# Svetainė:  http://localhost:8080      (React + Caddy, /api persiunčiama backend'ui)
# API:       http://localhost:8000/api/v1   (tiesiogiai – Postman'ui)
# PostgreSQL: localhost:5433 (naudotojas cinema / cinema) – ta pati DBVS kaip Render
#
# DĖMESIO: APP_KEY ir JWT_SECRET čia skirti TIK lokaliam demonstravimui.
# Produkcijoje (Render) sugeneruokite naujus: php artisan key:generate --show ir php artisan jwt:secret --show

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: absolutecinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cinema", "-d", "absolutecinema"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      APP_KEY: "base64:yTTKltsRwKkL93PlMt9Ooa5tpKUpPBeLkjehtNxJsno="
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: absolutecinema
      DB_USERNAME: cinema
      DB_PASSWORD: cinema
      JWT_SECRET: "0ea61c3f361fd4ff6ad76382d2081ff3312fea771aa562f5af885b766bdabf78"
      JWT_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8080"
    restart: on-failure

  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://backend:8080
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  postgres-data:
